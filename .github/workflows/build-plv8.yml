name: Build plv8 Extension

on:
  push:
    branches:
      - main
    paths:
      - 'plv8/**'
      - '.github/workflows/build-plv8.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/plv8
  PG_VERSION: "18"
  PLV8_VERSION: "3.2.4"
  DISTRO: trixie

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single-arch image
        run: |
          cd plv8
          docker buildx bake build --push \
            --set build.platform=${{ matrix.platform }} \
            --set build.tags=${IMAGE}:${PG_VERSION}-${PLV8_VERSION}-${DISTRO}-${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          STAMP=$(date -u +%Y%m%d%H%M)
          docker buildx imagetools create \
            --tag ${IMAGE}:${PG_VERSION}-${PLV8_VERSION}-${DISTRO} \
            --tag ${IMAGE}:${PG_VERSION}-${PLV8_VERSION}-${STAMP}-${DISTRO} \
            ${IMAGE}:${PG_VERSION}-${PLV8_VERSION}-${DISTRO}-amd64 \
            ${IMAGE}:${PG_VERSION}-${PLV8_VERSION}-${DISTRO}-arm64
